<!DOCTYPE html>
<html>
<head>
    <title>HTML Table</title>
</head>
<body>

<h1>Student Table</h1>

<table border="1">
    <tr>
        <th colspan="3">Student Details</th>
    </tr>

    <tr>
        <th>Name</th>
        <th>Course</th>
        <th>Marks</th>
    </tr>

    <tr>
        <td>Rahul</td>
        <td>Computer Science</td>
        <td>85</td>
    </tr>

    <tr>
        <td>Anita</td>
        <td>Computer Science</td>
        <td>90</td>
    </tr>

    <tr>
        <td rowspan="2">Total</td>
        <td>Average</td>
        <td>87.5</td>
    </tr>

    <tr>
        <td>Result</td>
        <td>Pass</td>
    </tr>
</table>

</body>
</html>
