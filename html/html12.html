<!DOCTYPE html>
<html>
<head>
    <title>CSS Properties</title>

    <style>
        h1 {
            color: blue;
            font-family: Arial;
        }

        p {
            color: green;
            font-size: 18px;
            margin: 20px;
            padding: 15px;
            border: 2px solid black;
        }

        .box {
            background-color: yellow;
            padding: 20px;
        }
    </style>
</head>
<body>

<h1>CSS Selectors and Properties</h1>

<p>This paragraph demonstrates color, font, margin, padding and border.</p>

<div class="box">
    This is a styled box.
</div>

</body>
</html>
