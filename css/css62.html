<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Alignment and Ordering</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f7fb;
            text-align: center;
        }

        .container {
            width: 80%;
            height: 300px;
            margin: 40px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            background-color: #dbeafe;
        }

        .box {
            width: 100px;
            height: 100px;
            background-color: #2563eb;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box1 {
            order: 3;
        }

        .box2 {
            order: 1;
        }

        .box3 {
            order: 2;
        }
    </style>
</head>

<body>

    <h1>Flexbox Alignment and Ordering</h1>

    <div class="container">

        <div class="box box1">Box 1</div>
        <div class="box box2">Box 2</div>
        <div class="box box3">Box 3</div>

    </div>

</body>
</html>
