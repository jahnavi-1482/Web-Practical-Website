<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Lists and Tables</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #1e293b;
        }

        .box {
            background-color: white;
            padding: 25px;
            max-width: 800px;
            margin: 30px auto;
            border-radius: 10px;
        }

        ul {
            list-style-type: square;
            line-height: 2;
        }

        ol {
            list-style-type: upper-roman;
            line-height: 2;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #333;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #2563eb;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #e5e7eb;
        }

    </style>
</head>

<body>

    <h1>CSS Lists and Tables</h1>

    <div class="box">

        <h2>Unordered List</h2>

        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>

        <h2>Ordered List</h2>

        <ol>
            <li>Design</li>
            <li>Development</li>
            <li>Testing</li>
        </ol>

        <h2>Student Table</h2>

        <table>

            <tr>
                <th>Name</th>
                <th>Course</th>
                <th>Marks</th>
            </tr>

            <tr>
                <td>Rahul</td>
                <td>HTML</td>
                <td>85</td>
            </tr>

            <tr>
                <td>Priya</td>
                <td>CSS</td>
                <td>90</td>
            </tr>

            <tr>
                <td>Anu</td>
                <td>JavaScript</td>
                <td>88</td>
            </tr>

        </table>

    </div>

</body>

</html>
