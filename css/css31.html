<!DOCTYPE html>
<html>
<head>
    <title>CSS Gradients</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f7fb;
        }

        h1 {
            text-align: center;
        }

        .linear {
            width: 80%;
            height: 150px;
            margin: 30px auto;
            background: linear-gradient(to right, blue, purple);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .radial {
            width: 250px;
            height: 250px;
            margin: 30px auto;
            background: radial-gradient(circle, yellow, orange, red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>CSS Gradients</h1>

    <div class="linear">
        Linear Gradient
    </div>

    <div class="radial">
        Radial Gradient
    </div>

</body>
</html>
