<!DOCTYPE html>
<html>
<head>
    <title>Sticky Header</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        header {
            position: sticky;
            top: 0;
            background-color: #1e293b;
            color: white;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }

        .content {
            padding: 30px;
            line-height: 2;
        }

        .section {
            height: 400px;
            padding: 30px;
            margin-bottom: 20px;
            background-color: #dbeafe;
        }
    </style>
</head>

<body>

    <header>
        <h1>Sticky Header</h1>
        <p>This header stays at the top while scrolling.</p>
    </header>

    <div class="content">

        <div class="section">
            <h2>Section 1</h2>
            <p>This is the first section.</p>
        </div>

        <div class="section">
            <h2>Section 2</h2>
            <p>This is the second section.</p>
        </div>

        <div class="section">
            <h2>Section 3</h2>
            <p>This is the third section.</p>
        </div>

    </div>

</body>
</html>
