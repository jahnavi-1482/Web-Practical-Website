<!DOCTYPE html>
<html>
<head>
    <title>Product Card</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f7fb;
        }

        .card {
            width: 300px;
            margin: 60px auto;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
            padding: 20px;
            text-align: center;
        }

        .product-image {
            width: 200px;
            height: 150px;
            background-color: #dbeafe;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }

        h2 {
            color: #2563eb;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            color: green;
        }

        button {
            padding: 10px 20px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="product-image">📱</div>

        <h2>Smart Phone</h2>

        <p>A modern smartphone with useful features.</p>

        <p class="price">₹20,000</p>

        <button>Buy Now</button>

    </div>

</body>
</html>
