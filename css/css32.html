<!DOCTYPE html>
<html>
<head>
    <title>CSS Shadows</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f7fb;
            text-align: center;
        }

        h1 {
            color: #2563eb;
            text-shadow: 3px 3px 5px gray;
        }

        .box {
            width: 300px;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
            box-shadow: 5px 5px 15px gray;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>CSS Shadows</h1>

    <div class="box">
        <h2>Box Shadow</h2>
        <p>This box uses the box-shadow property.</p>
    </div>

</body>
</html>
