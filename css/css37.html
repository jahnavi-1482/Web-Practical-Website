<!DOCTYPE html>
<html>
<head>
    <title>CSS Display Properties</title>

    <style>
        body {
            font-family: Arial;
        }

        .block {
            display: block;
            background-color: #dbeafe;
            padding: 15px;
            margin: 10px;
        }

        .inline {
            display: inline;
            background-color: #dcfce7;
            padding: 10px;
        }

        .inline-block {
            display: inline-block;
            background-color: #fef3c7;
            padding: 20px;
            margin: 10px;
        }

        .none {
            display: none;
        }
    </style>
</head>

<body>

    <h1>CSS Display Properties</h1>

    <div class="block">
        Block Element
    </div>

    <span class="inline">
        Inline Element
    </span>

    <div class="inline-block">
        Inline-Block Element
    </div>

    <div class="none">
        This element has display: none.
    </div>

</body>
</html>
