<!DOCTYPE html>
<html>
<head>
    <title>CSS Only Modal</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f4f7fb;
        }

        .modal {
            width: 350px;
            margin: 100px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px gray;
        }

        .modal h2 {
            color: #2563eb;
        }

        .close {
            display: inline-block;
            padding: 10px 20px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .close:hover {
            background-color: #1e40af;
        }
    </style>
</head>

<body>

    <div class="modal">

        <h2>Modal Popup</h2>

        <p>
            This is a CSS-only modal or popup design.
        </p>

        <a href="#" class="close">Close</a>

    </div>

</body>
</html>
