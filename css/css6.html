<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Width Height and Sizing</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        .fixed {
            width: 300px;
            height: 100px;
            background-color: #bfdbfe;
            padding: 20px;
            margin: 20px;
        }

        .percentage {
            width: 70%;
            height: 100px;
            background-color: #bbf7d0;
            padding: 20px;
            margin: 20px;
        }

        .max-width {
            width: 90%;
            max-width: 500px;
            height: 100px;
            background-color: #fde68a;
            padding: 20px;
            margin: 20px;
        }

    </style>
</head>

<body>

    <h1>CSS Width, Height and Sizing</h1>

    <div class="fixed">
        Fixed Width: 300px<br>
        Fixed Height: 100px
    </div>

    <div class="percentage">
        Width: 70%
    </div>

    <div class="max-width">
        Width: 90% with Maximum Width: 500px
    </div>

</body>

</html>
