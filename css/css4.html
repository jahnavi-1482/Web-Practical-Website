<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Font Properties</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            padding: 30px;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 36px;
            font-weight: bold;
            color: #1e3a8a;
        }

        .text1 {
            font-size: 20px;
            font-style: italic;
            color: #dc2626;
        }

        .text2 {
            font-family: "Courier New", monospace;
            font-size: 18px;
            font-weight: bold;
            color: #15803d;
        }

        .text3 {
            text-align: center;
            text-transform: uppercase;
            text-decoration: underline;
            letter-spacing: 3px;
            word-spacing: 8px;
        }

        .box {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

    </style>
</head>

<body>

    <div class="box">

        <h1>Font Properties and Text Formatting</h1>

        <p class="text1">
            This paragraph demonstrates font size, font style and color.
        </p>

        <p class="text2">
            This paragraph demonstrates font family and font weight.
        </p>

        <p class="text3">
            This text demonstrates text formatting properties.
        </p>

    </div>

</body>

</html>
