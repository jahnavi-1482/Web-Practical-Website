<!DOCTYPE html>
<html>
<head>
    <title>Dark Mode</title>

    <style>
        :root {
            --background: #ffffff;
            --text: #222222;
            --card: #f4f4f4;
        }

        body {
            font-family: Arial;
            margin: 0;
            background-color: var(--background);
            color: var(--text);
        }

        header {
            background-color: var(--card);
            padding: 25px;
            text-align: center;
        }

        .content {
            width: 80%;
            margin: 40px auto;
            padding: 30px;
            background-color: var(--card);
            text-align: center;
        }

        .dark {
            --background: #111827;
            --text: white;
            --card: #1f2937;
        }
    </style>
</head>

<body>

    <header>
        <h1>Dark Mode Webpage</h1>
    </header>

    <div class="content dark">

        <h2>Dark Mode</h2>

        <p>
            CSS variables can be changed to create a dark theme.
        </p>

    </div>

</body>
</html>
