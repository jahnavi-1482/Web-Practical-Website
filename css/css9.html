<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Navigation Bar</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
        }

        nav {
            background-color: #1e293b;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            margin: 5px;
            display: inline-block;
            border-radius: 6px;
        }

        nav a:hover {
            background-color: #2563eb;
        }

        .content {
            text-align: center;
            padding: 60px 20px;
        }

        h1 {
            color: #1e293b;
        }

    </style>
</head>

<body>

    <nav>

        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Courses</a>
        <a href="#">Contact</a>

    </nav>

    <div class="content">

        <h1>Styled Navigation Bar</h1>

        <p>
            This webpage demonstrates a navigation bar created using CSS.
        </p>

    </div>

</body>

</html>
