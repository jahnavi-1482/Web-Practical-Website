<!DOCTYPE html>
<html>
<head>
    <title>Border Radius</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f4f7fb;
        }

        .square {
            width: 150px;
            height: 150px;
            background-color: #2563eb;
            margin: 20px auto;
            border-radius: 20px;
        }

        .circle {
            width: 150px;
            height: 150px;
            background-color: #16a34a;
            margin: 20px auto;
            border-radius: 50%;
        }

        .pill {
            width: 250px;
            height: 80px;
            background-color: #f97316;
            margin: 20px auto;
            border-radius: 40px;
        }
    </style>
</head>

<body>

    <h1>Border Radius Shapes</h1>

    <div class="square"></div>

    <div class="circle"></div>

    <div class="pill"></div>

</body>
</html>
