<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f4f7fb;
        }

        header {
            background-color: #1e293b;
            color: white;
            text-align: center;
            padding: 30px;
        }

        nav {
            background-color: #2563eb;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        section {
            width: 80%;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 8px gray;
        }

        h2 {
            color: #2563eb;
        }

        .skills {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .skill {
            background-color: #dbeafe;
            padding: 15px;
            border-radius: 5px;
        }

        footer {
            background-color: #1e293b;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            nav a {
                display: block;
                margin: 10px;
            }

            section {
                width: 85%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Portfolio</h1>
        <p>Web Developer</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Skills</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>
    </nav>

    <section>
        <h2>About Me</h2>
        <p>
            I am a student interested in web development
            and modern technologies.
        </p>
    </section>

    <section>
        <h2>Skills</h2>

        <div class="skills">
            <div class="skill">HTML</div>
            <div class="skill">CSS</div>
            <div class="skill">JavaScript</div>
        </div>
    </section>

    <section>
        <h2>Projects</h2>
        <p>Student Management Website</p>
        <p>Data Structures Visualizer</p>
    </section>

    <section>
        <h2>Contact</h2>
        <p>Email: example@gmail.com</p>
    </section>

    <footer>
        <p>© 2026 My Portfolio</p>
    </footer>

</body>
</html>
