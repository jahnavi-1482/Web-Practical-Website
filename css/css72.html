<!DOCTYPE html>
<html>
<head>
    <title>Responsive Typography</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f4f7fb;
        }

        .content {
            width: 90%;
            margin: 50px auto;
            text-align: center;
        }

        h1 {
            font-size: 6vw;
            color: #2563eb;
        }

        p {
            font-size: 2.5vw;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 10vw;
            }

            p {
                font-size: 5vw;
            }
        }
    </style>
</head>

<body>

    <div class="content">

        <h1>Responsive Typography</h1>

        <p>
            The text size changes according to the screen size.
        </p>

    </div>

</body>
</html>
