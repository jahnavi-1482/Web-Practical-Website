<!DOCTYPE html>
<html>
<head>
    <title>Background Images</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        .top {
            height: 250px;
            background-image: url("https://via.placeholder.com/1000x250");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .box {
            width: 80%;
            height: 250px;
            margin: 30px auto;
            background-image: url("https://via.placeholder.com/800x250");
            background-repeat: no-repeat;
            background-size: contain;
            background-position: right center;
            background-color: #dbeafe;
            padding: 20px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <div class="top">
        <h1>Background Image</h1>
    </div>

    <div class="box">
        <h2>Background Positioning</h2>
        <p>
            This section demonstrates background size,
            background position, and background repeat.
        </p>
    </div>

</body>
</html>
