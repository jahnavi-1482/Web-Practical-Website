<!DOCTYPE html>
<html>
<head>
    <title>Combinator Selectors</title>

    <style>
        body {
            font-family: Arial;
        }

        /* Descendant selector */
        .box p {
            color: blue;
        }

        /* Child selector */
        .parent > p {
            background-color: yellow;
        }

        /* Adjacent sibling selector */
        h2 + p {
            color: red;
        }

        /* General sibling selector */
        h3 ~ p {
            background-color: #dcfce7;
        }

        div {
            padding: 20px;
            margin: 20px;
            border: 1px solid gray;
        }
    </style>
</head>

<body>

    <h1>CSS Combinator Selectors</h1>

    <div class="box">

        <p>Descendant selector example.</p>

    </div>

    <div class="parent">

        <p>Direct child paragraph.</p>

        <div>
            <p>Nested paragraph.</p>
        </div>

    </div>

    <h2>Heading 2</h2>
    <p>Adjacent sibling paragraph.</p>

    <h3>Heading 3</h3>
    <p>General sibling paragraph.</p>
    <p>Another general sibling paragraph.</p>

</body>
</html>
