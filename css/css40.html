<!DOCTYPE html>
<html>
<head>
    <title>Image Hover Effect</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f7fb;
            text-align: center;
        }

        .image {
            width: 400px;
            height: 250px;
            margin: 50px auto;
            overflow: hidden;
        }

        .image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .image img:hover {
            transform: scale(1.2);
        }
    </style>
</head>

<body>

    <h1>Image Hover Effect</h1>

    <div class="image">
        <img src="https://via.placeholder.com/400x250" alt="Sample Image">
    </div>

    <p>
        Move the mouse over the image to see the hover effect.
    </p>

</body>
</html>
