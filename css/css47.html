<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid Dashboard</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f4f7fb;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 200px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background-color: #1e293b;
            color: white;
            padding: 20px;
        }

        .main {
            padding: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 8px gray;
            text-align: center;
        }

        @media (max-width: 700px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <aside class="sidebar">
            <h2>Dashboard</h2>
            <p>Home</p>
            <p>Students</p>
            <p>Courses</p>
            <p>Reports</p>
        </aside>

        <main class="main">

            <h1>Dashboard</h1>

            <div class="cards">

                <div class="card">
                    <h2>120</h2>
                    <p>Students</p>
                </div>

                <div class="card">
                    <h2>15</h2>
                    <p>Courses</p>
                </div>

                <div class="card">
                    <h2>8</h2>
                    <p>Reports</p>
                </div>

            </div>

        </main>

    </div>

</body>
</html>
