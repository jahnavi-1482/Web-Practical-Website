<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f7fb;
            margin: 0;
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        .gallery {
            width: 90%;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .photo {
            height: 180px;
            background-color: #dbeafe;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            border-radius: 10px;
        }

        @media (max-width: 700px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Photo Gallery</h1>

    <div class="gallery">

        <div class="photo">🌄</div>
        <div class="photo">🌳</div>
        <div class="photo">🏖️</div>
        <div class="photo">🌆</div>
        <div class="photo">🏔️</div>
        <div class="photo">🌊</div>

    </div>

</body>
</html>
