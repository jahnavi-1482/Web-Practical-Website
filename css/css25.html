<!DOCTYPE html>
<html>
<head>
    <title>Website Homepage</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f4f7fb;
        }

        header {
            background-color: #1e293b;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #2563eb;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .hero {
            text-align: center;
            padding: 70px 20px;
            background-color: #dbeafe;
        }

        .hero h1 {
            font-size: 40px;
            color: #1e3a8a;
        }

        .content {
            width: 80%;
            margin: 30px auto;
            text-align: center;
        }

        footer {
            background-color: #1e293b;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>
        <p>Welcome to our homepage</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <section class="hero">
        <h1>Welcome!</h1>
        <p>This is a complete website homepage created using HTML and CSS.</p>
    </section>

    <div class="content">
        <h2>About Us</h2>
        <p>
            We provide useful information and services through our website.
        </p>
    </div>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
