<!DOCTYPE html>
<html>
<head>
    <title>Responsive Login and Signup</title>

    <style>
        body {
            font-family: Arial;
            background-color: #eaf2ff;
        }

        .container {
            width: 80%;
            margin: 60px auto;
            display: flex;
            gap: 30px;
            justify-content: center;
        }

        .form {
            width: 350px;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            color: #2563eb;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
        }

        @media (max-width: 700px) {
            .container {
                flex-direction: column;
                align-items: center;
            }

            .form {
                width: 80%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="form">
            <h2>Login</h2>

            <label>Email</label>
            <input type="email" placeholder="Enter email">

            <label>Password</label>
            <input type="password" placeholder="Enter password">

            <button>Login</button>
        </div>

        <div class="form">
            <h2>Sign Up</h2>

            <label>Name</label>
            <input type="text" placeholder="Enter name">

            <label>Email</label>
            <input type="email" placeholder="Enter email">

            <label>Password</label>
            <input type="password" placeholder="Enter password">

            <button>Sign Up</button>
        </div>

    </div>

</body>
</html>
