<!DOCTYPE html>
<html>
<head>
    <title>CSS Calc Function</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f4f7fb;
        }

        .container {
            width: calc(100% - 80px);
            margin: 40px;
            background-color: white;
            padding: 30px;
            box-sizing: border-box;
        }

        .box {
            width: calc(100% - 100px);
            margin: 20px auto;
            padding: 20px;
            background-color: #dbeafe;
            box-sizing: border-box;
        }

        h1 {
            color: #2563eb;
            font-size: calc(20px + 2vw);
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>CSS calc() Function</h1>

        <div class="box">
            <p>
                The calc() function allows calculations to be used
                for CSS property values.
            </p>
        </div>

    </div>

</body>
</html>
