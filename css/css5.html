<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Box Model</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #1e293b;
        }

        .box {
            width: 400px;
            margin: 40px auto;
            border: 10px solid #2563eb;
            padding: 30px;
            background-color: #dbeafe;
            text-align: center;
        }

        .content {
            background-color: white;
            padding: 20px;
        }

    </style>
</head>

<body>

    <h1>CSS Box Model</h1>

    <div class="box">

        <div class="content">
            Content Area
        </div>

        <p>Margin → Border → Padding → Content</p>

    </div>

</body>

</html>
