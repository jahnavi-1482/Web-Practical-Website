<!DOCTYPE html>
<html>
<head>
    <title>Mobile First Design</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f4f7fb;
        }

        header {
            background-color: #1e293b;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            margin: 20px auto;
        }

        .card {
            background-color: white;
            padding: 25px;
            margin-bottom: 20px;
            text-align: center;
            border-radius: 8px;
        }

        @media (min-width: 600px) {
            .container {
                display: flex;
                gap: 20px;
            }

            .card {
                flex: 1;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Mobile First Website</h1>
    </header>

    <div class="container">

        <div class="card">
            <h2>HTML</h2>
            <p>Learn webpage structure.</p>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>Learn webpage styling.</p>
        </div>

        <div class="card">
            <h2>JavaScript</h2>
            <p>Learn webpage interaction.</p>
        </div>

    </div>

</body>
</html>
