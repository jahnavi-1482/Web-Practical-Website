<!DOCTYPE html>
<html>
<head>
    <title>Dropdown Menu</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        nav {
            background-color: #1e293b;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .dropdown {
            display: inline-block;
            position: relative;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 150px;
            box-shadow: 0 0 8px gray;
        }

        .dropdown-content a {
            display: block;
            color: black;
            padding: 12px;
            margin: 0;
        }

        .dropdown-content a:hover {
            background-color: #dbeafe;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }
    </style>
</head>

<body>

    <nav>

        <a href="#">Home</a>

        <div class="dropdown">

            <a href="#">Courses ▼</a>

            <div class="dropdown-content">
                <a href="#">HTML</a>
                <a href="#">CSS</a>
                <a href="#">JavaScript</a>
            </div>

        </div>

        <a href="#">Contact</a>

    </nav>

</body>
</html>
