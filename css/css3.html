<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Colors Backgrounds and Borders</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            padding: 30px;
        }

        h1 {
            color: purple;
            text-align: center;
        }

        .color-box {
            color: white;
            background-color: #2563eb;
            padding: 20px;
            margin: 20px 0;
            border: 3px solid #1e3a8a;
        }

        .background-box {
            background-color: #fef3c7;
            padding: 30px;
            margin: 20px 0;
            border: 2px dashed orange;
        }

        .border-box {
            background-color: white;
            padding: 25px;
            margin: 20px 0;
            border: 5px solid green;
            border-radius: 10px;
        }

    </style>
</head>

<body>

    <h1>CSS Colors, Backgrounds and Borders</h1>

    <div class="color-box">
        This box demonstrates CSS colors.
    </div>

    <div class="background-box">
        This box demonstrates background colors.
    </div>

    <div class="border-box">
        This box demonstrates borders.
    </div>

</body>

</html>
