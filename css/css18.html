<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Animations</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #1e293b;
        }

        .box {
            width: 150px;
            height: 150px;
            background-color: #2563eb;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 80px auto;

            animation: moveBox 3s infinite alternate;
        }

        @keyframes moveBox {

            from {
                transform: translateX(-150px);
            }

            to {
                transform: translateX(150px);
            }

        }

    </style>
</head>

<body>

    <h1>CSS Animation</h1>

    <div class="box">
        Animated Box
    </div>

</body>

</html>
