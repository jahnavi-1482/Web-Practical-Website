<!DOCTYPE html>
<html>
<head>
    <title>Online Shopping</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f4f7fb;
        }

        header {
            background-color: #1e293b;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .products {
            width: 90%;
            margin: 30px auto;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .product {
            width: 250px;
            background-color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 8px gray;
        }

        .image {
            height: 150px;
            background-color: #dbeafe;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
        }

        .price {
            color: green;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Online Shopping</h1>
        <p>Shop Your Favourite Products</p>
    </header>

    <div class="products">

        <div class="product">
            <div class="image">👟</div>
            <h2>Shoes</h2>
            <p class="price">₹1,500</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <div class="image">⌚</div>
            <h2>Watch</h2>
            <p class="price">₹2,000</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <div class="image">🎧</div>
            <h2>Headphones</h2>
            <p class="price">₹1,200</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
