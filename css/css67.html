<!DOCTYPE html>
<html>
<head>
    <title>Keyframe Animation</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f4f7fb;
        }

        .box {
            width: 150px;
            height: 150px;
            margin: 80px auto;
            background-color: #2563eb;
            animation: moveBox 3s infinite;
        }

        @keyframes moveBox {
            0% {
                transform: translateX(0);
            }

            50% {
                transform: translateX(200px);
            }

            100% {
                transform: translateX(0);
            }
        }
    </style>
</head>

<body>

    <h1>CSS Keyframe Animation</h1>

    <div class="box"></div>

</body>
</html>
