<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Media Queries</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f7fb;
        }

        header {
            background-color: #1e293b;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .container {
            display: flex;
            gap: 20px;
            padding: 30px;
        }

        .box {
            flex: 1;
            background-color: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
        }

        @media (max-width: 700px) {

            .container {
                flex-direction: column;
            }

            header h1 {
                font-size: 24px;
            }

        }

    </style>
</head>

<body>

    <header>

        <h1>Responsive Webpage</h1>

        <p>Resize the browser window to see the effect.</p>

    </header>

    <div class="container">

        <div class="box">
            Section 1
        </div>

        <div class="box">
            Section 2
        </div>

        <div class="box">
            Section 3
        </div>

    </div>

</body>

</html>
