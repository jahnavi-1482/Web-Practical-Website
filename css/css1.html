<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inline, Internal and External CSS</title>

    <link rel="stylesheet" href="external-style.css">

    <style>
        .internal {
            color: blue;
            background-color: #e0f2fe;
            padding: 15px;
            border: 2px solid blue;
        }
    </style>
</head>

<body>

    <h1 style="color: black; background-color: pink; padding: 15px;">
        Inline CSS
    </h1>

    <p class="internal">
        This paragraph demonstrates Internal CSS.
    </p>

    <div class="external">
        This section demonstrates External CSS.
    </div>

</body>

</html>
