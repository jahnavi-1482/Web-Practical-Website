<!DOCTYPE html>
<html>
<head>
    <title>CSS Visibility</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .visible {
            background-color: #dcfce7;
            padding: 20px;
            margin: 20px;
        }

        .hidden {
            visibility: hidden;
            background-color: #fecaca;
            padding: 20px;
            margin: 20px;
        }

        .display-none {
            display: none;
            background-color: #dbeafe;
            padding: 20px;
            margin: 20px;
        }
    </style>
</head>

<body>

    <h1>Visibility and Hiding</h1>

    <div class="visible">
        This element is visible.
    </div>

    <div class="hidden">
        This element is hidden using visibility: hidden.
    </div>

    <div class="display-none">
        This element is hidden using display: none.
    </div>

    <p>
        The hidden element still occupies space,
        while display:none removes the element from the layout.
    </p>

</body>
</html>
