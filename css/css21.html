<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f7fb;
            margin: 0;
        }

        .profile {
            width: 500px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
            text-align: center;
        }

        h1 {
            color: #2563eb;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
        }

        .details {
            text-align: left;
            margin-top: 20px;
        }

        .details p {
            border-bottom: 1px solid #ddd;
            padding: 8px;
        }
    </style>
</head>

<body>

    <div class="profile">

        <h1>Student Profile</h1>

        <div class="details">
            <p><b>Name:</b> Rahul Kumar</p>
            <p><b>College:</b> ABC College of Engineering</p>
            <p><b>Department:</b> Computer Science</p>
            <p><b>Year:</b> 2nd Year</p>
            <p><b>Email:</b> rahul@example.com</p>
        </div>

    </div>

</body>
</html>
