<!DOCTYPE html>
<html>
<head>
    <title>Responsive Footer</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f4f7fb;
        }

        .content {
            min-height: 400px;
            padding: 30px;
            text-align: center;
        }

        footer {
            background-color: #1e293b;
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .footer-section {
            width: 200px;
            margin: 10px;
        }

        .footer-section h3 {
            color: #60a5fa;
        }

        @media (max-width: 600px) {
            footer {
                flex-direction: column;
                text-align: center;
                align-items: center;
            }
        }
    </style>
</head>

<body>

    <div class="content">
        <h1>Responsive Footer</h1>
        <p>
            This webpage demonstrates a responsive footer.
        </p>
    </div>

    <footer>

        <div class="footer-section">
            <h3>About</h3>
            <p>About our website.</p>
        </div>

        <div class="footer-section">
            <h3>Services</h3>
            <p>Our services and features.</p>
        </div>

        <div class="footer-section">
            <h3>Contact</h3>
            <p>Email: example@gmail.com</p>
        </div>

    </footer>

</body>
</html>
