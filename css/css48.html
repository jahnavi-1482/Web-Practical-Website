<!DOCTYPE html>
<html>
<head>
    <title>Two Column Layout</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f4f7fb;
        }

        .container {
            width: 90%;
            margin: 40px auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .content,
        .sidebar {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 8px gray;
        }

        .content h1,
        .sidebar h2 {
            color: #2563eb;
        }

        @media (max-width: 700px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <section class="content">
            <h1>Main Content</h1>
            <p>
                This is the main content section of the webpage.
            </p>
            <p>
                CSS Grid is used to create the two-column layout.
            </p>
        </section>

        <aside class="sidebar">
            <h2>Sidebar</h2>
            <p>Latest Updates</p>
            <p>Useful Links</p>
            <p>Announcements</p>
        </aside>

    </div>

</body>
</html>
