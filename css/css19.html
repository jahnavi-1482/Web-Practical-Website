<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Navigation Menu</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
        }

        nav {
            background-color: #1e293b;
            display: flex;
            justify-content: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 12px 20px;
        }

        nav a:hover {
            background-color: #2563eb;
            border-radius: 6px;
        }

        .content {
            text-align: center;
            padding: 60px 20px;
        }

        @media (max-width: 600px) {

            nav {
                flex-direction: column;
                text-align: center;
            }

            nav a {
                margin: 3px 0;
            }

        }

    </style>
</head>

<body>

    <nav>

        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>

    </nav>

    <div class="content">

        <h1>Responsive Navigation Menu</h1>

        <p>
            Resize the browser window to see the responsive menu.
        </p>

    </div>

</body>

</html>
