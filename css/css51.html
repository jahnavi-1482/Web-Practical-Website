<!DOCTYPE html>
<html>
<head>
    <title>Fixed Sidebar</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f4f7fb;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 200px;
            height: 100%;
            background-color: #1e293b;
            color: white;
            padding: 20px;
            box-sizing: border-box;
        }

        .sidebar h2 {
            text-align: center;
        }

        .sidebar p {
            padding: 10px;
        }

        .content {
            margin-left: 220px;
            padding: 30px;
        }

        .section {
            height: 300px;
            background-color: white;
            margin-bottom: 20px;
            padding: 20px;
            box-shadow: 0 0 8px gray;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>Menu</h2>
        <p>Home</p>
        <p>About</p>
        <p>Services</p>
        <p>Contact</p>
    </div>

    <div class="content">

        <div class="section">
            <h1>Fixed Sidebar</h1>
            <p>
                The sidebar remains fixed while the page is scrolled.
            </p>
        </div>

        <div class="section">
            <h2>Section 2</h2>
            <p>
                This is another section of the webpage.
            </p>
        </div>

        <div class="section">
            <h2>Section 3</h2>
            <p>
                Continue scrolling to see the fixed sidebar.
            </p>
        </div>

    </div>

</body>
</html>
