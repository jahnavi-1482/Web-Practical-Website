<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Webpage</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #fff7ed;
        }

        header {
            background-color: #7c2d12;
            color: white;
            text-align: center;
            padding: 30px;
        }

        nav {
            background-color: #ea580c;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .menu {
            width: 90%;
            margin: 30px auto;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .item {
            width: 250px;
            background-color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 8px gray;
        }

        .item h2 {
            color: #c2410c;
        }

        .price {
            font-weight: bold;
            color: green;
            font-size: 20px;
        }

        footer {
            background-color: #7c2d12;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Delicious Restaurant</h1>
        <p>Fresh Food, Great Taste</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Menu</a>
        <a href="#">Contact</a>
    </nav>

    <h1 style="text-align:center;">Our Menu</h1>

    <div class="menu">

        <div class="item">
            <h2>Pizza</h2>
            <p>Cheesy vegetable pizza.</p>
            <p class="price">₹250</p>
        </div>

        <div class="item">
            <h2>Burger</h2>
            <p>Fresh vegetable burger.</p>
            <p class="price">₹150</p>
        </div>

        <div class="item">
            <h2>Pasta</h2>
            <p>Delicious creamy pasta.</p>
            <p class="price">₹200</p>
        </div>

    </div>

    <footer>
        <p>© 2026 Delicious Restaurant</p>
    </footer>

</body>
</html>
