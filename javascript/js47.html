<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Program 47</title>

    <style>
        body {
            font-family: Arial;
        }

        button {
            padding: 8px;
        }
    </style>
</head>
<body>

<h1>Interactive Webpage</h1>

<p id="message">Welcome to the webpage.</p>

<button onclick="changeMessage()">Click Me</button>

<script>
function changeMessage() {
    document.getElementById("message").innerHTML =
        "The webpage is now interactive!";
}
</script>

</body>
</html>
