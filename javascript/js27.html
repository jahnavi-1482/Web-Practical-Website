<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Program 27</title>
</head>
<body>

<h1>JavaScript Program 27</h1>

<h2 id="clock"></h2>

<script>
function showTime() {
    let time = new Date();

    let hours = time.getHours();
    let minutes = time.getMinutes();
    let seconds = time.getSeconds();

    document.getElementById("clock").innerHTML =
        hours + ":" + minutes + ":" + seconds;
}

setInterval(showTime, 1000);

showTime();
</script>

</body>
</html>
