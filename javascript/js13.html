<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Program 13</title>
</head>
<body>

<h1>JavaScript Program 13</h1>

<p>Write a program to sort an array.</p>

<input type="text" id="array" placeholder="Enter numbers separated by commas">

<button onclick="sortArray()">Sort</button>

<p id="output"></p>

<script>
function sortArray() {
    let array = document.getElementById("array").value
        .split(",")
        .map(Number);

    array.sort(function(a, b) {
        return a - b;
    });

    document.getElementById("output").innerHTML =
        "Sorted array = " + array.join(", ");
}
</script>

</body>
</html>
