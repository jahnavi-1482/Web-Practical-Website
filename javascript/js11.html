<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Program 11</title>
</head>
<body>

<h1>JavaScript Program 11</h1>

<p>Write a program to find the sum of digits of a number.</p>

<input type="number" id="number" placeholder="Enter a number">

<button onclick="sumDigits()">Find Sum</button>

<p id="output"></p>

<script>
function sumDigits() {
    let number = Math.abs(Number(document.getElementById("number").value));
    let sum = 0;

    while (number > 0) {
        sum = sum + (number % 10);
        number = Math.floor(number / 10);
    }

    document.getElementById("output").innerHTML =
        "Sum of digits = " + sum;
}
</script>

</body>
</html>
