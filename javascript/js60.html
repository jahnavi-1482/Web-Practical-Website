<!DOCTYPE html>
<html>
<head>
    <title>Common Elements</title>
</head>
<body>

<script>
let arr1 = [1, 2, 3, 4, 5];
let arr2 = [3, 4, 5, 6, 7];

let common = arr1.filter(function(element) {
    return arr2.includes(element);
});

document.write("First array: " + arr1 + "<br>");
document.write("Second array: " + arr2 + "<br>");
document.write("Common elements: " + common);
</script>

</body>
</html>
