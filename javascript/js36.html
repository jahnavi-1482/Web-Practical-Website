<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Program 36</title>
</head>
<body>

<h1>JavaScript Program 36</h1>

<input type="number" id="seconds" placeholder="Enter seconds">

<button onclick="startCountdown()">Start</button>

<h2 id="display"></h2>

<script>
let timer;

function startCountdown() {

    let seconds = Number(document.getElementById("seconds").value);

    clearInterval(timer);

    document.getElementById("display").innerHTML = seconds;

    timer = setInterval(function() {

        seconds--;

        document.getElementById("display").innerHTML = seconds;

        if (seconds <= 0) {
            clearInterval(timer);
            document.getElementById("display").innerHTML = "Time's up!";
        }

    }, 1000);
}
</script>

</body>
</html>
