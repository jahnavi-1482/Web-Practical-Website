<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Program 31</title>
</head>
<body>

<h1>JavaScript Program 31</h1>

<p>Validate name, email, phone number, and password using JavaScript.</p>

<form onsubmit="return validateForm()">

    <input type="text" id="name" placeholder="Enter name">
    <br><br>

    <input type="email" id="email" placeholder="Enter email">
    <br><br>

    <input type="text" id="phone" placeholder="Enter phone number">
    <br><br>

    <input type="password" id="password" placeholder="Enter password">
    <br><br>

    <button type="submit">Submit</button>

</form>

<p id="output"></p>

<script>
function validateForm() {

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let phone = document.getElementById("phone").value;
    let password = document.getElementById("password").value;

    if (name === "") {
        document.getElementById("output").innerHTML = "Enter your name.";
        return false;
    }

    if (email === "") {
        document.getElementById("output").innerHTML = "Enter your email.";
        return false;
    }

    if (phone === "" || phone.length !== 10) {
        document.getElementById("output").innerHTML =
            "Enter a valid 10-digit phone number.";
        return false;
    }

    if (password.length < 6) {
        document.getElementById("output").innerHTML =
            "Password must contain at least 6 characters.";
        return false;
    }

    document.getElementById("output").innerHTML =
        "All details are valid.";

    return false;
}
</script>

</body>
</html>
