<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>

    <style>
        button {
            width: 60px;
            height: 60px;
            font-size: 25px;
        }
    </style>
</head>
<body>

<h2>Tic-Tac-Toe</h2>

<div id="game"></div>

<h3 id="result"></h3>

<button onclick="resetGame()">Reset</button>

<script>
let board = ["", "", "", "", "", "", "", ""];
let player = "X";

function createBoard() {

    let game = document.getElementById("game");

    game.innerHTML = "";

    for (let i = 0; i < 9; i++) {

        let button = document.createElement("button");

        button.innerHTML = board[i];

        button.onclick = function() {
            play(i);
        };

        game.appendChild(button);

        if ((i + 1) % 3 == 0) {
            game.appendChild(document.createElement("br"));
        }
    }
}

function play(index) {

    if (board[index] != "") {
        return;
    }

    board[index] = player;

    if (checkWinner()) {

        document.getElementById("result").innerHTML =
            player + " Wins!";

    } else {

        player = player == "X" ? "O" : "X";
    }

    createBoard();
}

function checkWinner() {

    let combinations = [
        [0,1,2],
        [3,4,5],
        [6,7,8],
        [0,3,6],
        [1,4,7],
        [2,5,8],
        [0,4,8],
        [2,4,6]
    ];

    return combinations.some(function(c) {

        return board[c[0]] &&
               board[c[0]] == board[c[1]] &&
               board[c[1]] == board[c[2]];
    });
}

function resetGame() {

    board = ["", "", "", "", "", "", "", "", ""];

    player = "X";

    document.getElementById("result").innerHTML = "";

    createBoard();
}

createBoard();
</script>

</body>
</html>
