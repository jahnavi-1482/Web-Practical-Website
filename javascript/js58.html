<!DOCTYPE html>
<html>
<head>
    <title>Merge Two Arrays</title>
</head>
<body>

<script>
let arr1 = [1, 2, 3];
let arr2 = [4, 5, 6];

let mergedArray = arr1.concat(arr2);

document.write("First array: " + arr1 + "<br>");
document.write("Second array: " + arr2 + "<br>");
document.write("Merged array: " + mergedArray);
</script>

</body>
</html>
