<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Program 22</title>
</head>
<body>

<h1>JavaScript Program 22</h1>

<p id="text">This is the original text.</p>

<button onclick="changeText()">Change Text</button>

<script>
function changeText() {
    document.getElementById("text").innerHTML =
        "The text has been changed using JavaScript.";
}
</script>

</body>
</html>
