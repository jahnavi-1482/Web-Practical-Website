<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript 03 - Largest Number</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
        }

        input {
            padding: 10px;
            margin: 8px;
        }

        button {
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
        }

        #output {
            margin-top: 20px;
            color: green;
            font-size: 20px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>JavaScript Program 3</h1>

    <h3>Question</h3>
    <p>Write a program to find the largest of three numbers.</p>

    <input type="number" id="num1" placeholder="Number 1">
    <input type="number" id="num2" placeholder="Number 2">
    <input type="number" id="num3" placeholder="Number 3">

    <br><br>

    <button onclick="findLargest()">Find Largest</button>

    <div id="output"></div>

    <br>
    <a href="index.html">← Back to JavaScript Programs</a>

</div>

<script>
    function findLargest() {

        let a = Number(document.getElementById("num1").value);
        let b = Number(document.getElementById("num2").value);
        let c = Number(document.getElementById("num3").value);

        let largest = Math.max(a, b, c);

        document.getElementById("output").innerHTML =
            "Largest number is: " + largest;
    }
</script>

</body>
</html>
