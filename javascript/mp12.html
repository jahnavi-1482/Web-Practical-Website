<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
</head>
<body>

<h2>Shopping Cart</h2>

<button onclick="addItem('Laptop', 50000)">
    Laptop - ₹50000
</button>

<button onclick="addItem('Mouse', 500)">
    Mouse - ₹500
</button>

<button onclick="addItem('Keyboard', 1000)">
    Keyboard - ₹1000
</button>

<h3>Cart</h3>

<ul id="cart"></ul>

<h3>Total: ₹<span id="total">0</span></h3>

<script>
let total = 0;

function addItem(name, price) {

    let li = document.createElement("li");

    li.innerHTML = name + " - ₹" + price;

    document.getElementById("cart").appendChild(li);

    total += price;

    document.getElementById("total").innerHTML = total;
}
</script>

</body>
</html>
