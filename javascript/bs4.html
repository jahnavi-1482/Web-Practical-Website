<!DOCTYPE html>
<html>
<head>
    <title>History Object</title>
</head>
<body>

<h2>History Object</h2>

<button onclick="goBack()">Go Back</button>

<button onclick="goForward()">Go Forward</button>

<p id="result"></p>

<script>

function goBack() {

    window.history.back();
}

function goForward() {

    window.history.forward();
}

document.getElementById("result").innerHTML =
    "Number of pages in history: " + window.history.length;

</script>

</body>
</html>
