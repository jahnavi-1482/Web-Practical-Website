<!DOCTYPE html>
<html>
<head>
    <title>Regular Expression</title>
</head>
<body>

<script>
let str = prompt("Enter a string:");
let pattern = /hello/i;

if (pattern.test(str)) {
    document.write("The word 'hello' is present in the string.");
} else {
    document.write("The word 'hello' is not present in the string.");
}
</script>

</body>
</html>
