<!DOCTYPE html>
<html>
<head>
    <title>Character Frequency</title>
</head>
<body>

<script>
let str = prompt("Enter a string:");
let frequency = {};

for (let char of str) {
    if (char !== " ") {
        if (frequency[char]) {
            frequency[char]++;
        } else {
            frequency[char] = 1;
        }
    }
}

for (let char in frequency) {
    document.write(char + " : " + frequency[char] + "<br>");
}
</script>

</body>
</html>
