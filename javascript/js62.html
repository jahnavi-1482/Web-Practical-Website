<!DOCTYPE html>
<html>
<head>
    <title>String Palindrome</title>
</head>
<body>

<script>
let str = prompt("Enter a string:");

let reversed = str.split("").reverse().join("");

if (str === reversed) {
    document.write(str + " is a palindrome.");
} else {
    document.write(str + " is not a palindrome.");
}
</script>

</body>
</html>
