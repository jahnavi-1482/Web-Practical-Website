<!DOCTYPE html>
<html>
<head>
    <title>Drag and Drop</title>

    <style>

        #box {
            width: 100px;
            height: 100px;
            background-color: blue;
            color: white;
            text-align: center;
            padding-top: 20px;
            box-sizing: border-box;
            cursor: move;
        }

        #dropArea {
            width: 300px;
            height: 200px;
            border: 3px dashed black;
            margin-top: 30px;
            text-align: center;
            padding-top: 50px;
            box-sizing: border-box;
        }

    </style>
</head>

<body>

<h2>Drag and Drop Application</h2>

<div id="box"
     draggable="true"
     ondragstart="dragStart(event)">
    Drag Me
</div>

<div id="dropArea"
     ondragover="allowDrop(event)"
     ondrop="drop(event)">

    Drop Here

</div>

<p id="message"></p>

<script>

function dragStart(event) {

    event.dataTransfer.setData("text", event.target.id);

}

function allowDrop(event) {

    event.preventDefault();

}

function drop(event) {

    event.preventDefault();

    let id = event.dataTransfer.getData("text");

    let box = document.getElementById(id);

    document.getElementById("dropArea").appendChild(box);

    document.getElementById("message").innerHTML =
        "Item dropped successfully";

}

</script>

</body>
</html>
