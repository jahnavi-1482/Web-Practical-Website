<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Program 44</title>
</head>
<body>

<h1>JavaScript Program 44</h1>

<button onclick="displayData()">Get API Data</button>

<div id="output"></div>

<script>
function displayData() {

    fetch("https://jsonplaceholder.typicode.com/users")
        .then(response => response.json())
        .then(data => {

            let output = "";

            data.forEach(function(user) {
                output +=
                    "<p>Name: " + user.name +
                    "<br>Email: " + user.email +
                    "</p>";
            });

            document.getElementById("output").innerHTML = output;
        })
        .catch(error => {
            document.getElementById("output").innerHTML =
                "Error fetching data.";
        });
}
</script>

</body>
</html>
