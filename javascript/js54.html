<!DOCTYPE html>
<html>
<head>
    <title>Power of a Number</title>
</head>
<body>

<script>
let base = parseInt(prompt("Enter the base:"));
let exponent = parseInt(prompt("Enter the exponent:"));

let result = base ** exponent;

document.write(base + " raised to the power " + exponent + " is " + result);
</script>

</body>
</html>
