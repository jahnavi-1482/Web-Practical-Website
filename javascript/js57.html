<!DOCTYPE html>
<html>
<head>
    <title>Remove Duplicates</title>
</head>
<body>

<script>
let arr = [10, 20, 10, 30, 20, 40, 30];

let uniqueArray = [...new Set(arr)];

document.write("Original array: " + arr + "<br>");
document.write("Array without duplicates: " + uniqueArray);
</script>

</body>
</html>
