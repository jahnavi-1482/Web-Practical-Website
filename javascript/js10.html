<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript 10 - Reverse Number</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f7fb;
            text-align: center;
            padding: 50px;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
        }

        input {
            padding: 10px;
        }

        button {
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
        }

        #output {
            margin-top: 20px;
            font-size: 20px;
            color: green;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>JavaScript Program 10</h1>

    <h3>Question</h3>
    <p>Write a program to reverse a number.</p>

    <input type="number" id="number" placeholder="Enter a number">

    <br><br>

    <button onclick="reverseNumber()">Reverse</button>

    <div id="output"></div>

    <br>
    <a href="index.html">← Back to JavaScript Programs</a>

</div>

<script>
    function reverseNumber() {

        let number = document.getElementById("number").value;

        let reversed = number.split("").reverse().join("");

        document.getElementById("output").innerHTML =
            "Reversed number: " + reversed;
    }
</script>

</body>
</html>
