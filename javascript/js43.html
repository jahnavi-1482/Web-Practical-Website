<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Program 43</title>
</head>
<body>

<h1>JavaScript Program 43</h1>

<p>Fetch data from an API using Fetch API.</p>

<button onclick="getData()">Fetch Data</button>

<p id="output"></p>

<script>
function getData() {

    fetch("https://jsonplaceholder.typicode.com/posts/1")
        .then(response => response.json())
        .then(data => {
            document.getElementById("output").innerHTML =
                "Title: " + data.title + "<br>" +
                "Body: " + data.body;
        })
        .catch(error => {
            document.getElementById("output").innerHTML =
                "Error fetching data.";
        });
}
</script>

</body>
</html>
