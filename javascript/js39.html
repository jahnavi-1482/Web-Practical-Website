<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Program 39</title>
</head>
<body>

<h1>JavaScript Program 39</h1>

<p id="output"></p>

<script>
let numbers1 = [1, 2, 3];
let numbers2 = [4, 5, 6];

let combined = [...numbers1, ...numbers2];

function sum(...numbers) {
    let total = 0;

    for (let number of numbers) {
        total += number;
    }

    return total;
}

document.getElementById("output").innerHTML =
    "Using Spread Operator: " + combined.join(", ") + "<br>" +
    "Using Rest Operator: " + sum(1, 2, 3, 4, 5);
</script>

</body>
</html>
